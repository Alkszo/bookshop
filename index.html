<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
</head>
<body>
    <nav> <!--Navigation bar linking to different part of the shop, Home should always return to landing page-->
        <ul>
            <li class="nav-item">Home</li>
            <li class="nav-item">Find Books</li>
            <li class="nav-item">Shoping Cart</li>
            <li class="nav-item">Contact</li>
        </ul>
    </nav>
    <h1>Online Book Store</h1> <!--Header can be updated when name for the shop is chosen-->
    <div id="main-content"> <!--Main content area contains open source illustrative photo and welcome message-->
        <img src="https://www.shutterstock.com/image-photo/book-open-pages-close-up-600nw-2562942291.jpg" 
        alt="Open book with bookshelves in the background">
        <section id="welcome text">
            <p>Welcome to our bookstore! Select Find Books to start shoping or Shoping Cart for checkout</p>
        </section>
    </div>
    <footer> Created by Aleksander Szostakowski, 2026 </footer> <!--Always include all developer names and publish year in the footer -->
</body>
</html>
